name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler and adds the wasm target.
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo build --release --target wasm32-unknown-unknown
      # The JavaScript loader against this build, in Node and in Chrome (on the runner), checked
      # against the native encoder's fixtures. Before the encoder-only build, which overwrites it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: js
      - run: npm test
        working-directory: js
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: symbology-wasm
          path: target/wasm32-unknown-unknown/release/symbology.wasm
      - run: cargo build --release --target wasm32-unknown-unknown --no-default-features
      - run: ls -l target/wasm32-unknown-unknown/release/*.wasm
